<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FinAlly</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #1a1a2e;
        --border: #2a2f3a;
        --text: #c9d1d9;
        --muted: #7d8590;
        --accent: #ecad0a;
        --blue: #209dd7;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      }
      main {
        max-width: 34rem;
        padding: 2rem 2.5rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.5rem;
        letter-spacing: 0.04em;
        color: var(--accent);
      }
      p {
        margin: 0.75rem 0 0;
        line-height: 1.6;
        color: var(--muted);
      }
      a {
        color: var(--blue);
      }
      code {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>FinAlly</h1>
      <p>The backend is running and serving this placeholder page.</p>
      <p>
        Check the market feed at <a href="/api/health">/api/health</a>, or open the live price
        stream at <code>/api/stream/prices</code>.
      </p>
      <p>The Next.js trading terminal replaces this file when the frontend is built.</p>
    </main>
  </body>
</html>
